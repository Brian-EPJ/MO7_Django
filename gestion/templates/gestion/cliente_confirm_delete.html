{% extends "gestion/base.html" %}
{% block title %}Eliminar cliente{% endblock %}
{% block content %}
    <main>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4 text-center">
                    <div class="card aw-card p-4">
                         <h1>Eliminar Cliente</h1>
                        <i class="bi bi-exclamation-triangle-fill text-warning fs-1 mb-3"></i>
                        <p>¿Confirmas que deseas eliminar a <strong>{{ object.nombre }}</strong>?</p>
                        <form method="post">
                            {% csrf_token %}
                            <a href="{% url 'cliente_list' %}" class="btn aw-btn-outline btn-sm">Cancelar</a>
                            <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i> Sí, eliminar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
